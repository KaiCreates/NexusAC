# Render Blueprint. Import the repo at render.com -> New -> Blueprint and this
# configures the service; or create a Web Service manually with the same build
# and start commands.
services:
  - type: web
    name: nexusac
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Keep deployed schemas in lockstep with the bridge before accepting a
    # heartbeat. Every migration is idempotent, so restarts are safe.
    startCommand: python scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # sync:false means "prompt me in the dashboard, never store it in git".
      # Copy each value from your local .env. APP_URL is optional on Render:
      # left blank, the app uses RENDER_EXTERNAL_URL (the service's own URL).
      # Set it only for a custom domain.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: REQUIRE_EMAIL_CONFIRMATION
        value: "false"
