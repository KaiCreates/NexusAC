# Render Blueprint (render.com -> New -> Blueprint), or a Web Service with the
# same build/start commands. ONE worker: the live link to the game server lives
# in memory.
services:
  - type: web
    name: nexusac
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Postgres connection string (Neon: the pooled one). Holds only accounts
      # and server keys -- read once at start, written only when they change.
      - key: DATABASE_URL
        sync: false
